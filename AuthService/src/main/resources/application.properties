

# ============================================================
#  Relearn Auth Service - Application Configuration
# ============================================================

spring.application.name=relearn-auth-service
server.port=8081

# ============================================================
#  PostgreSQL Database Configuration
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/relearn_users
spring.datasource.username=postgres
spring.datasource.password=Uhirwashami54.
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
#  JPA / Hibernate Configuration
# ============================================================
# update  -> auto-creates/updates tables on startup (good for dev)
# validate -> only validates schema (use in production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================================
#  JWT Configuration
# ============================================================
# Secret key (Base64-encoded, minimum 256 bits for HS256)
# IMPORTANT: Change this to a strong random secret in production!
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Access token expiration: 15 minutes (in milliseconds)
jwt.access-token-expiration=900000
# Refresh token expiration: 7 days (in milliseconds)
jwt.refresh-token-expiration=604800000

# ============================================================
#  Swagger / OpenAPI Configuration
# ============================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false

# ============================================================
#  Email Configuration (Gmail SMTP)
