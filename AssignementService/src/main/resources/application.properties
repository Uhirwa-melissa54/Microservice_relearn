# ============================================================
#  Relearn Assignment Service - Application Configuration
# ============================================================

spring.application.name=relearn-assignment-service
server.port=8083

# ============================================================
#  PostgreSQL Database Configuration
# ============================================================
# Make sure you create this database first:
#   CREATE DATABASE relearn_assignments;
spring.datasource.url=jdbc:postgresql://localhost:5432/relearn_assignments
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
#  JPA / Hibernate Configuration
# ============================================================
# update  -> auto-creates/updates tables on startup (good for dev)
# validate -> only validates schema (recommended for production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================================
#  JWT Configuration (same secret as Auth Service)
# ============================================================
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

# ============================================================
#  Swagger / OpenAPI Configuration
# ============================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.try-it-out-enabled=true
