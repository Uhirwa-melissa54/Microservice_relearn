# ============================================================
#  Relearn Notes Service - Application Configuration
# ============================================================

spring.application.name=relearn-notes-service
server.port=8082

# ============================================================
#  PostgreSQL Database Configuration
# ============================================================
# Make sure you create this database first:
#   CREATE DATABASE relearn_notes;
spring.datasource.url=jdbc:postgresql://localhost:5432/relearn_notes
spring.datasource.username=postgres
spring.datasource.password=Uhirwashami54.
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
#  JPA / Hibernate Configuration
# ============================================================
# update  -> auto-creates/updates tables on startup (good for dev)
# validate -> only validates schema (recommended for production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================================
#  JWT Configuration (same secret as Auth Service)
# ============================================================
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

# ============================================================
#  File Storage Configuration
# ============================================================
# Directory where teacher note files are stored
file.upload.notes-dir=C:/Users/HP/Downloads/notes
# Max file size per upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ============================================================
#  Swagger / OpenAPI Configuration
# ============================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.try-it-out-enabled=true



eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true