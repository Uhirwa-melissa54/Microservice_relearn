spring.application.name=APIGateway
server.port=8080

# ============================================================
#  Eureka Discovery
# ============================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ============================================================
#  CORS — additional origins (comma-separated), e.g. production URL
#  Primary CORS is configured in CorsConfig.java
# ============================================================
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000

# ============================================================
#  Gateway Routes
#  IMPORTANT: First matching route wins. Specific paths MUST be
#  listed before broad paths (/api/admin/**, /api/student/**, etc.)
# ============================================================

# --- Public auth ---
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://RELEARN-AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# --- Admin sub-services (before /api/admin/**) ---
spring.cloud.gateway.routes[1].id=assignment-service-admin
spring.cloud.gateway.routes[1].uri=lb://RELEARN-ASSIGNMENT-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/admin/assignments/**

spring.cloud.gateway.routes[2].id=notes-service-admin
spring.cloud.gateway.routes[2].uri=lb://RELEARN-NOTES-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/admin/notes/**

# --- Teacher sub-services (before /api/teacher/**) ---
spring.cloud.gateway.routes[3].id=assignment-service-teacher-assignments
spring.cloud.gateway.routes[3].uri=lb://RELEARN-ASSIGNMENT-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/teacher/assignments/**

spring.cloud.gateway.routes[4].id=assignment-service-teacher-submissions
spring.cloud.gateway.routes[4].uri=lb://RELEARN-ASSIGNMENT-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/teacher/submissions/**

spring.cloud.gateway.routes[5].id=notes-service-teacher-notes
spring.cloud.gateway.routes[5].uri=lb://RELEARN-NOTES-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/teacher/notes/**

# --- Student sub-services (before /api/student/**) ---
spring.cloud.gateway.routes[6].id=assignment-service-student-assignments
spring.cloud.gateway.routes[6].uri=lb://RELEARN-ASSIGNMENT-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/student/assignments/**

spring.cloud.gateway.routes[7].id=notes-service-student-notes
spring.cloud.gateway.routes[7].uri=lb://RELEARN-NOTES-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/student/notes/**

# --- Assignment & submission APIs ---
spring.cloud.gateway.routes[8].id=assignment-service-submissions
spring.cloud.gateway.routes[8].uri=lb://RELEARN-ASSIGNMENT-SERVICE
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/submissions/**

spring.cloud.gateway.routes[9].id=assignment-service-assignments
spring.cloud.gateway.routes[9].uri=lb://RELEARN-ASSIGNMENT-SERVICE
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/assignments/**

# --- Notes API ---
spring.cloud.gateway.routes[10].id=notes-service-notes
spring.cloud.gateway.routes[10].uri=lb://RELEARN-NOTES-SERVICE
spring.cloud.gateway.routes[10].predicates[0]=Path=/api/notes/**

# --- Auth Service (profile & admin — broad paths last) ---
spring.cloud.gateway.routes[11].id=auth-service-users
spring.cloud.gateway.routes[11].uri=lb://RELEARN-AUTH-SERVICE
spring.cloud.gateway.routes[11].predicates[0]=Path=/api/users/**

spring.cloud.gateway.routes[12].id=auth-service-admin
spring.cloud.gateway.routes[12].uri=lb://RELEARN-AUTH-SERVICE
spring.cloud.gateway.routes[12].predicates[0]=Path=/api/admin/**

spring.cloud.gateway.routes[13].id=auth-service-student
spring.cloud.gateway.routes[13].uri=lb://RELEARN-AUTH-SERVICE
spring.cloud.gateway.routes[13].predicates[0]=Path=/api/student/**

spring.cloud.gateway.routes[14].id=auth-service-teacher
spring.cloud.gateway.routes[14].uri=lb://RELEARN-AUTH-SERVICE
spring.cloud.gateway.routes[14].predicates[0]=Path=/api/teacher/**

# Dedupe CORS response headers when multiple filters apply
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
