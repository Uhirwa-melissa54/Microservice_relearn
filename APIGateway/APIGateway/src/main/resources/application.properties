spring.application.name=APIGateway
server.port=8080

# ============================================================
#  Eureka Discovery
# ============================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ============================================================
#  Gateway Routes
#  Frontend calls: http://localhost:8080/api/auth/**
#                  http://localhost:8080/api/notes/**
#                  http://localhost:8080/api/assignments/**
#                  http://localhost:8080/api/admin/**
#                  http://localhost:8080/api/teacher/**
#                  http://localhost:8080/api/student/**
# ============================================================

# Auth Service — handles /api/auth/**, /api/users/**, /api/student/**, /api/teacher/**, /api/admin/**
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://RELEARN-AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[1].id=auth-service-users
spring.cloud.gateway.routes[1].uri=lb://RELEARN-AUTH-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/users/**

spring.cloud.gateway.routes[2].id=auth-service-student
spring.cloud.gateway.routes[2].uri=lb://RELEARN-AUTH-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/student/**

spring.cloud.gateway.routes[3].id=auth-service-teacher-profile
spring.cloud.gateway.routes[3].uri=lb://RELEARN-AUTH-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/teacher/**

spring.cloud.gateway.routes[4].id=auth-service-admin
spring.cloud.gateway.routes[4].uri=lb://RELEARN-AUTH-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/admin/**

# Notes Service — handles /api/notes/**, /api/teacher/notes/** (notes-specific teacher routes)
spring.cloud.gateway.routes[5].id=notes-service
spring.cloud.gateway.routes[5].uri=lb://RELEARN-NOTES-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/notes/**

# Assignment Service — handles /api/assignments/**, /api/submissions/**, /api/teacher/assignments/**, /api/student/assignments/**
spring.cloud.gateway.routes[6].id=assignment-service
spring.cloud.gateway.routes[6].uri=lb://RELEARN-ASSIGNMENT-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/assignments/**

spring.cloud.gateway.routes[7].id=assignment-service-submissions
spring.cloud.gateway.routes[7].uri=lb://RELEARN-ASSIGNMENT-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/submissions/**

spring.cloud.gateway.routes[8].id=assignment-service-teacher
spring.cloud.gateway.routes[8].uri=lb://RELEARN-ASSIGNMENT-SERVICE
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/teacher/assignments/**

spring.cloud.gateway.routes[9].id=assignment-service-teacher-submissions
spring.cloud.gateway.routes[9].uri=lb://RELEARN-ASSIGNMENT-SERVICE
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/teacher/submissions/**

spring.cloud.gateway.routes[10].id=assignment-service-student
spring.cloud.gateway.routes[10].uri=lb://RELEARN-ASSIGNMENT-SERVICE
spring.cloud.gateway.routes[10].predicates[0]=Path=/api/student/assignments/**

spring.cloud.gateway.routes[11].id=notes-service-teacher
spring.cloud.gateway.routes[11].uri=lb://RELEARN-NOTES-SERVICE
spring.cloud.gateway.routes[11].predicates[0]=Path=/api/teacher/notes/**

spring.cloud.gateway.routes[12].id=notes-service-student
spring.cloud.gateway.routes[12].uri=lb://RELEARN-NOTES-SERVICE
spring.cloud.gateway.routes[12].predicates[0]=Path=/api/student/notes/**

spring.cloud.gateway.routes[13].id=assignment-service-admin
spring.cloud.gateway.routes[13].uri=lb://RELEARN-ASSIGNMENT-SERVICE
spring.cloud.gateway.routes[13].predicates[0]=Path=/api/admin/assignments/**

spring.cloud.gateway.routes[14].id=notes-service-admin
spring.cloud.gateway.routes[14].uri=lb://RELEARN-NOTES-SERVICE
spring.cloud.gateway.routes[14].predicates[0]=Path=/api/admin/notes/**

# ============================================================
#  CORS Configuration (applied globally at the gateway)
#  This is the ONLY place CORS needs to be configured.
#  The frontend runs on http://localhost:5173 (Vite dev server).
# ============================================================
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

# Allow OPTIONS preflight requests to pass through without authentication
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
